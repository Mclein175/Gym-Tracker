<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Bed Revise</title>
<meta name="description" content="Tap a date to mark a Gym, Bed or Revise day.">
<meta name="theme-color" content="#121417">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preload" href="fonts/big-shoulders-display-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:800;font-display:swap;src:url("fonts/big-shoulders-display-800.woff2") format("woff2");}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/barlow-semi-condensed-500.woff2") format("woff2");}
@font-face{font-family:"Barlow Semi Condensed";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/barlow-semi-condensed-700.woff2") format("woff2");}
html{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);}
/* Palette: gym-floor rubber plus calibrated plate colours (red 25 kg, blue 20 kg, yellow 15 kg). */
:root {
  color-scheme: dark;
  --floor: #121417;
  --tile: #1c1f24;
  --tile-2: #262a31;
  --rim: #343a44;
  --chalk: #f1f2f4;
  --muted: #8c939e;
  --faint: #555c67;
  --accent: #ef3e42;
  --on-accent: #ffffff;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --ui: "Barlow Semi Condensed", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --gap: 6px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  height: 100%;
  box-sizing: border-box;
  background: var(--floor);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

body {
  height: 100%;
  margin: 0;
  background: var(--floor);
  color: var(--chalk);
  font: 500 16px/1.3 var(--ui);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 2px solid var(--chalk);
  outline-offset: 2px;
}

button:disabled {
  cursor: default;
}

/* ---------- Frame ---------- */

.app {
  height: 100%;
  min-height: 580px;
  max-width: 540px;
  margin: 0 auto;
  padding-block: 10px 12px;
  padding-inline: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* ---------- Header ---------- */

.top {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 34px;
}

.seg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border-radius: 10px;
  background: var(--tile);
}

.seg button {
  height: 28px;
  padding-inline: 14px;
  border-radius: 7px;
  font: 700 13px/1 var(--ui);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.seg button[aria-pressed="true"] {
  background: var(--chalk);
  color: var(--floor);
}

.small-btn {
  flex: none;
  height: 34px;
  padding-inline: 12px;
  border-radius: 9px;
  box-shadow: inset 0 0 0 1px var(--rim);
  font: 700 13px/1 var(--ui);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--chalk);
}

.head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}

.title {
  margin: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-weight: inherit;
}

.kicker {
  font: 700 13px/1 var(--ui);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.big {
  font: 800 clamp(34px, 12vw, 50px) / 0.86 var(--display);
  letter-spacing: 0.01em;
  text-transform: uppercase;
  white-space: nowrap;
}

.nav {
  flex: none;
  display: flex;
  gap: 8px;
}

.nav button {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: var(--tile);
  display: grid;
  place-items: center;
}

.nav button:disabled {
  opacity: 0.3;
}

.nav svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: var(--chalk);
  stroke-width: 2.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- Month ---------- */

.main {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.view {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dow {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: var(--gap);
  font: 700 12px/1 var(--ui);
  letter-spacing: 0.1em;
  color: var(--muted);
}

.dow span {
  padding-left: 8px;
}

.month {
  flex: 1 1 0;
  min-height: 250px;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: repeat(var(--rows, 5), minmax(38px, 88px));
  align-content: start;
  gap: var(--gap);
}

.day {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 7px 0 0 8px;
  border-radius: 8px;
  background: var(--tile);
  color: var(--chalk);
  font: 800 21px/1 var(--display);
  font-variant-numeric: tabular-nums;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.day[aria-pressed="true"] {
  background: var(--accent);
  color: var(--on-accent);
}

/* Tick drawn from two borders, so it takes the text colour of the cell. */
.day[aria-pressed="true"]::after {
  content: "";
  position: absolute;
  right: 11px;
  bottom: 11px;
  width: 7px;
  height: 13px;
  border: solid currentColor;
  border-width: 0 3px 3px 0;
  transform: rotate(45deg);
}

.day.is-today {
  box-shadow: inset 0 0 0 2px var(--chalk);
}

.day.is-today[aria-pressed="true"] {
  box-shadow: inset 0 0 0 2px var(--on-accent);
}

.day.is-future {
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--tile-2);
  color: var(--faint);
}

.day:active:not(:disabled) {
  transform: scale(0.94);
}

.day.pop {
  animation: pop 0.24s ease-out;
}

@keyframes pop {
  0% { transform: scale(0.9); }
  60% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* ---------- Year: one continuous strip per year, weeks as columns ---------- */

.year {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow-y: auto;
  --c: 5px;
  --g: 1.5px;
}

.yb {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.yb-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.yb-year {
  font: 800 24px/1 var(--display);
}

.yb-count {
  font: 500 14px/1 var(--ui);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.yb-grid {
  display: grid;
  grid-template-columns: 24px repeat(54, var(--c));
  grid-template-rows: 13px repeat(7, var(--c));
  gap: var(--g);
}

.yb-grid .ml {
  grid-row: 1;
  text-align: left;
  font: 600 10px/13px var(--ui);
  color: var(--muted);
  white-space: nowrap;
}

.yb-grid .dl {
  grid-column: 1;
  align-self: center;
  font: 600 9px/1 var(--ui);
  color: var(--faint);
}

.yb-grid i {
  border-radius: 1px;
  background: var(--tile-2);
}

.yb-grid i.on {
  background: var(--accent);
}

.yb-grid i.fut {
  background: var(--tile);
}

.yb-grid i.today {
  box-shadow: 0 0 0 1px var(--chalk);
}

/* ---------- Footer ---------- */

.foot {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.note {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0;
  padding: 8px 8px 8px 12px;
  min-height: 42px;
  border-radius: 10px;
  background: var(--tile);
  font: 500 14px/1.25 var(--ui);
  color: var(--muted);
}

.note b {
  font-weight: 700;
  color: var(--chalk);
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px 12px;
}

.stats-cap {
  margin: 0;
  font: 700 12px/1 var(--ui);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}

.stat {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.stat b {
  font: 800 38px/0.9 var(--display);
  font-variant-numeric: tabular-nums;
}

.stat span {
  font: 500 14px/1.15 var(--ui);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.habits {
  display: grid;
  grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
  gap: 8px;
}

.habit {
  height: 54px;
  border-radius: 12px;
  background: var(--tile);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font: 700 16px/1 var(--ui);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--chalk);
  transition: background-color 0.15s ease, color 0.15s ease;
}

.habit[aria-pressed="true"] {
  background: var(--c);
  color: var(--on-c);
}

/* Four options: stack the plate over the label so long names fit. */
.habits:has(> :nth-child(4)) .habit {
  padding-inline: 4px;
  flex-direction: column;
  gap: 6px;
  height: 60px;
  font-size: 14px;
  letter-spacing: 0.05em;
}

.habit-name {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.stats-head {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

/* Rarely used, so it stays quiet. */
.edit-link {
  margin: -10px -4px -10px 0;
  padding: 10px 4px;
  font: 600 12px/1 var(--ui);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
}

.empty {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.empty p {
  margin: 0;
  font: 500 15px/1.35 var(--ui);
  color: var(--muted);
}

.add-first {
  height: 54px;
  border-radius: 12px;
  border: 1.5px dashed var(--rim);
  font: 700 16px/1 var(--ui);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--chalk);
}

/* ---------- Options sheet ---------- */

.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(5, 6, 8, 0.6);
}

.sheet {
  width: 100%;
  max-width: 540px;
  max-height: 85%;
  overflow-y: auto;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  border-radius: 18px 18px 0 0;
  background: var(--tile);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.sheet-head h2 {
  margin: 0;
  font: 800 30px/1 var(--display);
  text-transform: uppercase;
}

.opt-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opt {
  min-height: 54px;
  padding: 5px 5px 5px 14px;
  border-radius: 12px;
  background: var(--floor);
  display: flex;
  align-items: center;
  gap: 10px;
}

.opt .plate {
  background: radial-gradient(circle, var(--floor) 0 2.5px, var(--c) 3px);
}

.opt-name,
.opt-add input {
  flex: 1;
  min-width: 0;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--chalk);
  font: 600 17px/1 var(--ui);
  -webkit-user-select: text;
  user-select: text;
  outline: none;
}

.opt-name:focus {
  box-shadow: inset 0 -2px 0 var(--chalk);
}

.opt-add input::placeholder {
  color: var(--faint);
}

.opt-count {
  flex: none;
  font: 500 13px/1 var(--ui);
  color: var(--muted);
}

.opt-del {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--muted);
}

.opt-del svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.opt.confirm {
  padding-left: 14px;
  gap: 8px;
}

.opt-q {
  flex: 1;
  min-width: 0;
  font: 500 15px/1.25 var(--ui);
  color: var(--muted);
}

.opt-q b {
  color: var(--chalk);
}

.small-btn.danger {
  background: #ef3e42;
  box-shadow: none;
  color: #ffffff;
}

.opt-add {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 54px;
  padding: 5px 5px 5px 14px;
  border-radius: 12px;
  box-shadow: inset 0 0 0 1px var(--rim);
}

.sheet-note {
  margin: 0;
  font: 500 14px/1.3 var(--ui);
  color: var(--muted);
}

/* A tiny weight plate: coloured disc with a centre hole. */
.plate {
  flex: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--tile) 0 2.5px, var(--c) 3px);
}

.habit[aria-pressed="true"] .plate {
  background: radial-gradient(circle, var(--c) 0 2.5px, var(--on-c) 3px);
}

@media (prefers-reduced-motion: reduce) {
  .day,
  .habit {
    transition: none;
  }
  .day.pop {
    animation: none;
  }
  .day:active:not(:disabled) {
    transform: none;
  }
}

/* ---------- Count options (amount per day, weekly target) ---------- */

.day .amt {
  position: absolute;
  left: 8px;
  right: 4px;
  bottom: 9px;
  overflow: hidden;
  font: 700 13px/1 var(--ui);
  font-variant-numeric: tabular-nums;
  text-align: left;
  white-space: nowrap;
}

.month[data-kind="count"] .day[aria-pressed="true"]::after {
  display: none;
}

.opt-target {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  font: 500 13px/1 var(--ui);
  color: var(--muted);
}

.opt-target input {
  width: 62px;
  height: 36px;
  padding: 0 8px;
  border: 0;
  border-radius: 8px;
  background: var(--tile);
  color: var(--chalk);
  font: 700 16px/1 var(--ui);
  text-align: right;
  -webkit-user-select: text;
  user-select: text;
  outline: none;
}

.opt-target input:focus {
  box-shadow: inset 0 0 0 1.5px var(--chalk);
}

.opt-add {
  flex-wrap: wrap;
}

.add-type {
  flex-basis: 100%;
  margin-top: 4px;
}

.add-type button {
  flex: 1;
}

.add-type button[aria-pressed="true"] {
  background: var(--chalk);
  color: var(--floor);
}

.entry-total {
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.entry-total b {
  font: 800 72px/0.85 var(--display);
  font-variant-numeric: tabular-nums;
  color: var(--c);
}

.entry-total span {
  font: 600 18px/1 var(--ui);
  color: var(--muted);
}

.entry-info {
  margin: 0;
  font: 500 15px/1.3 var(--ui);
  color: var(--muted);
}

#entry .add-btn {
  background: var(--c);
  box-shadow: none;
  color: var(--on-c);
}

.chips {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.chips button {
  height: 48px;
  border-radius: 10px;
  background: var(--floor);
  font: 700 17px/1 var(--ui);
  color: var(--chalk);
}

.chips button:active {
  background: var(--tile-2);
}

.entry-clear {
  align-self: flex-start;
  margin: 0;
  padding: 8px 0;
}

</style>
</head>
<body>
<div class="app" id="app" data-view="month">
  <div class="note" id="demo" hidden>
    <span><b>Example marks</b>, not saved.</span>
    <button type="button" class="small-btn" id="demoClear">Start empty</button>
  </div>

  <header class="top">
    <div class="bar">
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-view="month" aria-pressed="true">Month</button>
        <button type="button" data-view="year" aria-pressed="false">Year</button>
      </div>
      <button type="button" class="small-btn" id="todayBtn" hidden>Today</button>
    </div>
    <div class="head">
      <h1 class="title"><span class="kicker" id="kicker"></span><span class="big" id="big"></span></h1>
      <div class="nav">
        <button type="button" id="prev" aria-label="Previous month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <button type="button" id="next" aria-label="Next month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="view" id="monthView">
      <div class="dow" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="month" id="grid" role="group"></div>
    </section>
    <section class="view" id="yearView" hidden>
      <div class="year" id="year"></div>
    </section>
  </main>

  <footer class="foot">
    <p class="note" id="notice" role="status" hidden></p>
    <div class="stats" id="stats" aria-live="polite">
      <div class="stats-head">
        <p class="stats-cap" id="statsCap"></p>
        <button type="button" class="edit-link" id="editBtn">Edit</button>
      </div>
      <div class="stat"><b>0</b><span></span></div>
      <div class="stat"><b>0</b><span></span></div>
      <div class="stat"><b>0</b><span></span></div>
    </div>
    <div class="habits" id="habits" role="group" aria-label="What you are marking"></div>
    <div class="empty" id="empty" hidden>
      <p>Add the things you want to track, like Gym or Revise.</p>
      <button type="button" class="add-first" id="addFirst">Add an option</button>
    </div>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Options</h2>
      <button type="button" class="small-btn" id="sheetDone">Done</button>
    </div>
    <ul class="opt-list" id="optList"></ul>
    <form class="opt-add" id="optAdd">
      <div class="seg add-type" id="addType" role="group" aria-label="Kind of option">
        <button type="button" data-type="days" aria-pressed="true">Tick days</button>
        <button type="button" data-type="count" aria-pressed="false">Count</button>
      </div>
      <input id="optNew" maxlength="16" placeholder="New option" aria-label="New option name" autocomplete="off" enterkeyhint="done">
      <button type="submit" class="small-btn">Add</button>
    </form>
    <p class="sheet-note" id="sheetNote" role="status" hidden></p>
  </div>
</div>

<div class="sheet-backdrop" id="entry" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
    <div class="sheet-head">
      <h2 id="entryTitle">Today</h2>
      <button type="button" class="small-btn" id="entryDone">Done</button>
    </div>
    <p class="entry-total"><b id="entryTotal">0</b><span id="entryUnit"></span></p>
    <p class="entry-info" id="entryInfo"></p>
    <form class="opt-add" id="entryForm">
      <input id="entryAmt" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Amount done" aria-label="Amount done" autocomplete="off" enterkeyhint="done">
      <button type="submit" class="small-btn add-btn">Add</button>
    </form>
    <div class="chips" id="entryChips">
      <button type="button" data-add="10">+10</button>
      <button type="button" data-add="20">+20</button>
      <button type="button" data-add="25">+25</button>
      <button type="button" data-add="50">+50</button>
    </div>
    <button type="button" class="edit-link entry-clear" id="entryClear">Clear this day</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const PREVIEW = false; // the preview build flips this to show example marks

  const CONFIG = {"key": "gym-bed-revise:v1", "legacyColours": {"gym": 0, "bed": 1, "revise": 2}, "examples": [{"label": "Pushups", "colour": 3, "type": "count", "target": 500}, {"label": "Gym", "colour": 0, "odds": [0.85, 0.3, 0.85, 0.3, 0.8, 0.5, 0.1]}, {"label": "Bed", "colour": 1, "odds": [0.72, 0.72, 0.72, 0.72, 0.72, 0.72, 0.72]}, {"label": "Revise", "colour": 2, "odds": [0.78, 0.78, 0.78, 0.78, 0.78, 0.35, 0.35]}]};
  const KEY = CONFIG.key;
  const MAX_OPTIONS = 8;
  const PALETTE = [
    ['#ef3e42', '#ffffff'], ['#3b6cf6', '#ffffff'], ['#ffc428', '#17191c'], ['#2fbf71', '#0f1a14'],
    ['#a66cff', '#ffffff'], ['#ff8a3d', '#17191c'], ['#ff5fa2', '#17191c'], ['#22c3c3', '#0f1a1a'],
  ];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];
  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  const pad2 = (n) => (n < 10 ? '0' : '') + n;
  const keyOf = (y, m, d) => y + '-' + pad2(m + 1) + '-' + pad2(d);
  const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
  const firstDow = (y, m) => (new Date(y, m, 1).getDay() + 6) % 7; // Monday = 0
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  const $ = (id) => document.getElementById(id);
  const el = {
    app: $('app'),
    demo: $('demo'),
    demoClear: $('demoClear'),
    todayBtn: $('todayBtn'),
    kicker: $('kicker'),
    big: $('big'),
    prev: $('prev'),
    next: $('next'),
    monthView: $('monthView'),
    grid: $('grid'),
    yearView: $('yearView'),
    year: $('year'),
    notice: $('notice'),
    statsWrap: $('stats'),
    cap: $('statsCap'),
    editBtn: $('editBtn'),
    stats: Array.from(document.querySelectorAll('#stats .stat')),
    viewBtns: Array.from(document.querySelectorAll('.bar .seg button')),
    habits: $('habits'),
    empty: $('empty'),
    addFirst: $('addFirst'),
    sheet: $('sheet'),
    sheetDone: $('sheetDone'),
    optList: $('optList'),
    optAdd: $('optAdd'),
    optNew: $('optNew'),
    sheetNote: $('sheetNote'),
    addType: Array.from(document.querySelectorAll('#addType button')),
    entry: $('entry'),
    entryTitle: $('entryTitle'),
    entryTotal: $('entryTotal'),
    entryUnit: $('entryUnit'),
    entryInfo: $('entryInfo'),
    entryForm: $('entryForm'),
    entryAmt: $('entryAmt'),
    entryDone: $('entryDone'),
    entryClear: $('entryClear'),
    entryChips: $('entryChips'),
  };

  let now = {};
  function readToday() {
    const t = new Date();
    now = { y: t.getFullYear(), m: t.getMonth(), d: t.getDate() };
    now.key = keyOf(now.y, now.m, now.d);
  }
  readToday();

  /* habits: [{ id, label, color, on }], marks: { id: Set of 'YYYY-MM-DD' } */
  let habits = [];
  let marks = {};
  const state = { habit: null, view: 'month', y: now.y, m: now.m, demo: false, newType: 'days', entryKey: null };

  /* Two kinds of option: 'days' (tap a date to tick it) and 'count' (add amounts, weekly target). */
  const isCount = (h) => !!h && h.type === 'count';
  const amountOn = (h, k) => (isCount(h) ? marks[h.id].get(k) || 0 : marks[h.id].has(k) ? 1 : 0);
  const fmt = (n) => n.toLocaleString('en-GB');
  const emptyMarks = (h) => (isCount(h) ? new Map() : new Set());
  const cleanTarget = (v) => Math.min(100000, Math.max(1, Math.round(Number(v)) || 500));

  /* Monday-to-Sunday week containing today: what is done, and what is left this week and today. */
  function weekNumbers(h) {
    const dow = (new Date(now.y, now.m, now.d).getDay() + 6) % 7;
    let week = 0;
    for (let i = 0; i <= dow; i++) {
      const t = new Date(now.y, now.m, now.d - dow + i);
      week += amountOn(h, keyOf(t.getFullYear(), t.getMonth(), t.getDate()));
    }
    const today = amountOn(h, now.key);
    const leftAtStartOfToday = Math.max(0, h.target - (week - today));
    const goalToday = Math.ceil(leftAtStartOfToday / (7 - dow));
    return { week, today, leftWeek: Math.max(0, h.target - week), leftToday: Math.max(0, goalToday - today) };
  }

  const current = () => habits.find((h) => h.id === state.habit) || null;
  const colourFor = (c) => PALETTE.find((p) => p[0] === c) || PALETTE[0];
  function nextColour() {
    const used = new Set(habits.map((h) => h.color));
    return PALETTE.find((p) => !used.has(p[0])) || PALETTE[habits.length % PALETTE.length];
  }

  /* ---------- Storage (this browser only) ---------- */

  function readDates(list) {
    const s = new Set();
    if (Array.isArray(list)) list.forEach((k) => { if (typeof k === 'string' && DATE_RE.test(k)) s.add(k); });
    return s;
  }

  function readAmounts(obj) {
    const m = new Map();
    if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
      Object.keys(obj).forEach((k) => {
        const n = Math.round(Number(obj[k]));
        if (DATE_RE.test(k) && n > 0) m.set(k, n);
      });
    }
    return m;
  }

  function load() {
    let raw;
    try {
      raw = localStorage.getItem(KEY);
    } catch (e) {
      return { ok: false, found: false };
    }
    if (raw === null) return { ok: true, found: false };
    try {
      const obj = JSON.parse(raw) || {};
      if (Array.isArray(obj.habits)) {
        obj.habits.forEach((h) => {
          if (!h || typeof h.id !== 'string' || typeof h.label !== 'string') return;
          const c = colourFor(h.color);
          const hab = { id: h.id, label: h.label.slice(0, 16), color: c[0], on: c[1], type: h.type === 'count' ? 'count' : 'days' };
          if (isCount(hab)) hab.target = cleanTarget(h.target);
          habits.push(hab);
          marks[h.id] = isCount(hab) ? readAmounts(obj.marks && obj.marks[h.id]) : readDates(obj.marks && obj.marks[h.id]);
        });
      } else {
        // Older format: one list of dates per fixed option, e.g. { gym: [...], bed: [...] }.
        Object.keys(obj).forEach((id, i) => {
          if (!Array.isArray(obj[id])) return;
          const c = PALETTE[(CONFIG.legacyColours || {})[id] ?? i % PALETTE.length];
          habits.push({ id, label: id.charAt(0).toUpperCase() + id.slice(1), color: c[0], on: c[1], type: 'days' });
          marks[id] = readDates(obj[id]);
        });
      }
    } catch (e) {
      // Keep an unreadable copy rather than overwriting it on the next save.
      try { localStorage.setItem(KEY + ':unreadable', raw); } catch (e2) { /* ignore */ }
    }
    return { ok: true, found: true };
  }

  function save() {
    if (state.demo) return;
    const obj = {
      v: 2,
      habits: habits.map((h) => Object.assign({ id: h.id, label: h.label, color: h.color, type: h.type },
        isCount(h) ? { target: h.target } : {})),
      marks: {},
    };
    habits.forEach((h) => {
      obj.marks[h.id] = isCount(h) ? Object.fromEntries(Array.from(marks[h.id]).sort()) : Array.from(marks[h.id]).sort();
    });
    try {
      localStorage.setItem(KEY, JSON.stringify(obj));
      showNotice('');
    } catch (e) {
      showNotice('This browser is blocking storage, so marks will not be kept.');
    }
  }

  function showNotice(msg) {
    el.notice.textContent = msg;
    el.notice.hidden = !msg;
  }

  /* Example options and marks for the preview only, from last September up to yesterday. */
  function loadExamples() {
    let seed = 0x2f6b1c3d;
    const rand = () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    habits = [];
    marks = {};
    CONFIG.examples.forEach((ex, i) => {
      const c = PALETTE[ex.colour ?? i];
      const hab = { id: 'ex' + i, label: ex.label, color: c[0], on: c[1], type: ex.type || 'days' };
      if (isCount(hab)) hab.target = ex.target;
      habits.push(hab);
      marks['ex' + i] = emptyMarks(hab);
    });
    for (let t = new Date(now.y - 1, 8, 1); ; t.setDate(t.getDate() + 1)) {
      const k = keyOf(t.getFullYear(), t.getMonth(), t.getDate());
      if (k >= now.key) break;
      const dow = (t.getDay() + 6) % 7;
      CONFIG.examples.forEach((ex, i) => {
        if (ex.type === 'count') {
          if (rand() < 0.75) marks['ex' + i].set(k, 10 * Math.round(5 + rand() * 9));
        } else if (rand() < ex.odds[dow]) marks['ex' + i].add(k);
      });
    }
  }

  /* ---------- Rendering ---------- */

  function render() {
    if (!current()) state.habit = habits.length ? habits[0].id : null;
    const h = current();
    const isMonth = state.view === 'month';
    el.app.dataset.view = state.view;
    if (h) {
      el.app.style.setProperty('--accent', h.color);
      el.app.style.setProperty('--on-accent', h.on);
    }
    el.viewBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
    el.demo.hidden = !state.demo;

    el.monthView.hidden = !isMonth;
    el.yearView.hidden = isMonth;
    el.kicker.textContent = isMonth ? String(state.y) : 'Year';
    el.big.textContent = isMonth ? MONTHS[state.m] : String(state.y);
    el.prev.setAttribute('aria-label', isMonth ? 'Previous month' : 'Previous year');
    el.next.setAttribute('aria-label', isMonth ? 'Next month' : 'Next year');

    const shown = isMonth ? state.y * 12 + state.m : state.y;
    const cur = isMonth ? now.y * 12 + now.m : now.y;
    el.next.disabled = shown >= cur;
    el.todayBtn.hidden = shown === cur;

    if (isMonth) renderMonth();
    else renderYear();
    renderStats();
    renderHabits();
  }

  function renderHabits() {
    el.empty.hidden = habits.length > 0;
    el.habits.hidden = habits.length === 0;
    el.habits.style.setProperty('--cols', Math.min(habits.length, 4) || 1);
    el.habits.innerHTML = habits.map((h) =>
      '<button type="button" class="habit" data-habit="' + esc(h.id) + '" aria-pressed="' + (h.id === state.habit) + '"' +
      ' style="--c:' + h.color + ';--on-c:' + h.on + '"><i class="plate"></i><span class="habit-name">' + esc(h.label) + '</span></button>'
    ).join('');
  }

  function renderMonth() {
    const y = state.y;
    const m = state.m;
    const h = current();
    const off = firstDow(y, m);
    const dim = daysIn(y, m);
    el.grid.dataset.kind = isCount(h) ? 'count' : 'days';
    el.grid.style.setProperty('--rows', Math.ceil((off + dim) / 7));
    el.grid.setAttribute('aria-label', (h ? h.label + ', ' : '') + MONTHS[m] + ' ' + y);

    let html = '';
    for (let i = 0; i < off; i++) html += '<span class="pad"></span>';
    for (let d = 1; d <= dim; d++) {
      const k = keyOf(y, m, d);
      const isToday = k === now.key;
      const locked = k > now.key || !h;
      const amt = h ? amountOn(h, k) : 0;
      html += '<button type="button" class="day' + (isToday ? ' is-today' : '') + (k > now.key ? ' is-future' : '') + '"' +
        ' data-key="' + k + '" aria-pressed="' + (amt > 0) + '"' + (locked ? ' disabled' : '') +
        ' aria-label="' + DAYS[(off + d - 1) % 7] + ' ' + d + ' ' + MONTHS[m] + (isToday ? ', today' : '') +
        (isCount(h) && amt ? ', ' + amt + ' ' + esc(h.label) : '') + '">' +
        d + (isCount(h) && amt ? '<span class="amt">' + fmt(amt) + '</span>' : '') + '</button>';
    }
    el.grid.innerHTML = html;
  }

  function renderYear() {
    const h = current();
    let html = '';
    for (let yr = state.y; yr > state.y - 3; yr--) {
      const off = firstDow(yr, 0);
      let labels = '';
      let cells = '';
      let count = 0;
      let i = 0;
      for (let m = 0; m < 12; m++) {
        const dim = daysIn(yr, m);
        for (let d = 1; d <= dim; d++, i++) {
          const k = keyOf(yr, m, d);
          const pos = i + off;
          const col = Math.floor(pos / 7) + 2;
          const row = (pos % 7) + 2;
          if (d === 1) {
            labels += '<button type="button" class="ml" data-y="' + yr + '" data-m="' + m + '"' +
              ' style="grid-column:' + col + ' / span 4" aria-label="Open ' + MONTHS[m] + ' ' + yr + '">' +
              MONTHS[m].slice(0, 3) + '</button>';
          }
          let cls = '';
          const amt = h ? amountOn(h, k) : 0;
          if (amt) { cls = 'on'; count += amt; } else if (k > now.key) cls = 'fut';
          if (k === now.key) cls += ' today';
          cells += '<i data-y="' + yr + '" data-m="' + m + '"' + (cls ? ' class="' + cls.trim() + '"' : '') +
            ' style="grid-area:' + row + ' / ' + col + '"></i>';
        }
      }
      html += '<section class="yb"><div class="yb-head"><span class="yb-year">' + yr + '</span>' +
        (h ? '<span class="yb-count">' + (isCount(h) ? fmt(count) + ' ' + esc(h.label.toLowerCase())
          : plural(count, esc(h.label.toLowerCase()) + ' day')) + '</span>' : '') + '</div>' +
        '<div class="yb-grid">' +
        '<span class="dl" style="grid-area:2 / 1">Mon</span><span class="dl" style="grid-area:4 / 1">Wed</span>' +
        '<span class="dl" style="grid-area:6 / 1">Fri</span><span class="dl" style="grid-area:8 / 1">Sun</span>' +
        labels + cells + '</div></section>';
    }
    el.year.innerHTML = html;
    sizeYear();
  }

  /* Size the squares so 54 week columns fill the screen width. */
  function sizeYear() {
    if (state.view !== 'year') return;
    const W = el.year.clientWidth;
    if (!W) return;
    const c = Math.floor(Math.max(3, Math.min(14, (W - 24 - 54 * 1.5) / 54)) * 4) / 4;
    el.year.style.setProperty('--c', c + 'px');
  }

  function renderStats() {
    const h = current();
    el.statsWrap.hidden = !h;
    if (!h) return;
    if (isCount(h)) {
      const w = weekNumbers(h);
      el.cap.textContent = h.label;
      [[w.leftToday, 'left today'], [w.leftWeek, 'left this week'], [w.week, 'of ' + fmt(h.target) + ' this week']]
        .forEach((it, i) => {
          el.stats[i].hidden = false;
          el.stats[i].firstElementChild.textContent = fmt(it[0]);
          el.stats[i].lastElementChild.textContent = it[1];
        });
      return;
    }
    const set = marks[h.id];
    const yPrefix = state.y + '-';
    const mPrefix = keyOf(state.y, state.m, 1).slice(0, 8);
    let inYear = 0;
    let inMonth = 0;
    set.forEach((k) => {
      if (k.startsWith(yPrefix)) {
        inYear++;
        if (k.startsWith(mPrefix)) inMonth++;
      }
    });
    el.cap.textContent = h.label + ' days';
    const items = state.view === 'month'
      ? [[inMonth, 'in ' + MONTHS[state.m]], [inYear, 'in ' + state.y], [set.size, 'total']]
      : [[inYear, 'in ' + state.y], [set.size, 'total']];
    el.stats.forEach((s, i) => {
      const it = items[i];
      s.hidden = !it;
      if (it) {
        s.firstElementChild.textContent = it[0];
        s.lastElementChild.textContent = it[1];
      }
    });
  }

  /* ---------- Options sheet (add, rename, delete) ---------- */

  function openSheet() {
    renderOptions();
    setSheetNote('');
    el.sheet.hidden = false;
    if (!habits.length) el.optNew.focus();
  }

  function closeSheet() {
    if (document.activeElement && el.sheet.contains(document.activeElement)) document.activeElement.blur();
    el.sheet.hidden = true;
    render();
  }

  function setSheetNote(msg) {
    el.sheetNote.textContent = msg;
    el.sheetNote.hidden = !msg;
  }

  const TRASH = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></svg>';

  function renderOptions() {
    el.optList.innerHTML = habits.map((h) =>
      '<li class="opt" data-id="' + esc(h.id) + '" style="--c:' + h.color + '">' +
      '<i class="plate"></i>' +
      '<input class="opt-name" value="' + esc(h.label) + '" maxlength="16" aria-label="Rename ' + esc(h.label) + '" autocomplete="off" enterkeyhint="done">' +
      (isCount(h)
        ? '<label class="opt-target"><input inputmode="numeric" pattern="[0-9]*" maxlength="6" value="' + h.target + '"' +
          ' aria-label="Weekly target for ' + esc(h.label) + '"><span>a week</span></label>'
        : '<span class="opt-count">' + plural(marks[h.id].size, 'day') + '</span>') +
      '<button type="button" class="opt-del" data-act="ask" aria-label="Delete ' + esc(h.label) + '">' + TRASH + '</button></li>'
    ).join('');
    el.optAdd.hidden = habits.length >= MAX_OPTIONS;
  }

  function askDelete(li) {
    const h = habits.find((x) => x.id === li.dataset.id);
    const n = marks[h.id].size;
    li.classList.add('confirm');
    li.innerHTML = '<span class="opt-q">Delete <b>' + esc(h.label) + '</b>' +
      (n ? ' and its ' + plural(n, isCount(h) ? 'day' : 'mark') + (isCount(h) ? ' of entries' : '') : '') + '?</span>' +
      '<button type="button" class="small-btn" data-act="cancel">Cancel</button>' +
      '<button type="button" class="small-btn danger" data-act="delete">Delete</button>';
    li.querySelector('[data-act="cancel"]').focus();
  }

  function rename(input) {
    const id = input.closest('.opt').dataset.id;
    const h = habits.find((x) => x.id === id);
    const label = input.value.trim().slice(0, 16);
    const clash = habits.some((x) => x.id !== id && x.label.toLowerCase() === label.toLowerCase());
    if (!label || clash) {
      input.value = h.label;
      setSheetNote(clash ? 'You already have an option called ' + label + '.' : '');
      return;
    }
    if (label !== h.label) {
      h.label = label;
      save();
      setSheetNote('');
    }
  }

  el.optList.addEventListener('change', (e) => {
    if (e.target.classList.contains('opt-name')) rename(e.target);
    if (e.target.closest('.opt-target')) {
      const h = habits.find((x) => x.id === e.target.closest('.opt').dataset.id);
      h.target = cleanTarget(e.target.value);
      e.target.value = h.target;
      save();
    }
  });

  el.optList.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur();
  });

  el.optList.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const li = b.closest('.opt');
    if (b.dataset.act === 'ask') askDelete(li);
    else if (b.dataset.act === 'cancel') renderOptions();
    else if (b.dataset.act === 'delete') {
      const id = li.dataset.id;
      habits = habits.filter((x) => x.id !== id);
      delete marks[id];
      if (state.habit === id) state.habit = null;
      save();
      renderOptions();
    }
  });

  el.optAdd.addEventListener('submit', (e) => {
    e.preventDefault();
    const label = el.optNew.value.trim().slice(0, 16);
    if (!label) return;
    if (habits.some((x) => x.label.toLowerCase() === label.toLowerCase())) {
      setSheetNote('You already have an option called ' + label + '.');
      return;
    }
    if (habits.length >= MAX_OPTIONS) return;
    const c = nextColour();
    const id = 'h' + Date.now().toString(36);
    const hab = { id, label, color: c[0], on: c[1], type: state.newType };
    if (isCount(hab)) hab.target = 500;
    habits.push(hab);
    marks[id] = emptyMarks(hab);
    state.habit = id;
    save();
    el.optNew.value = '';
    setSheetNote('');
    renderOptions();
  });

  el.addType.forEach((b) => b.addEventListener('click', () => {
    state.newType = b.dataset.type;
    el.addType.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));

  /* ---------- Entry panel for count options ---------- */

  function openEntry(k) {
    state.entryKey = k;
    el.entryAmt.value = '';
    renderEntry();
    el.entry.hidden = false;
  }

  function renderEntry() {
    const h = current();
    const k = state.entryKey;
    const [y, m, d] = k.split('-').map(Number);
    const dow = (new Date(y, m - 1, d).getDay() + 6) % 7;
    el.entry.style.setProperty('--c', h.color);
    el.entry.style.setProperty('--on-c', h.on);
    el.entryTitle.textContent = (k === now.key ? 'Today' : DAYS[dow]) + ', ' + d + ' ' + MONTHS[m - 1];
    el.entryTotal.textContent = fmt(amountOn(h, k));
    el.entryUnit.textContent = h.label.toLowerCase();
    const w = weekNumbers(h);
    el.entryInfo.textContent = (k === now.key ? fmt(w.leftToday) + ' left today, ' : '') + fmt(w.leftWeek) + ' left this week';
    el.entryClear.hidden = !amountOn(h, k);
  }

  function addAmount(n) {
    const h = current();
    if (!h || !n) return;
    const total = Math.max(0, Math.min(1000000, amountOn(h, state.entryKey) + n));
    if (total) marks[h.id].set(state.entryKey, total);
    else marks[h.id].delete(state.entryKey);
    save();
    renderEntry();
    renderMonth();
    renderStats();
  }

  function closeEntry() {
    if (document.activeElement) document.activeElement.blur();
    el.entry.hidden = true;
    render();
  }

  el.entryForm.addEventListener('submit', (e) => {
    e.preventDefault();
    addAmount(Math.round(Number(el.entryAmt.value)) || 0);
    el.entryAmt.value = '';
  });
  el.entryChips.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-add]');
    if (b) addAmount(Number(b.dataset.add));
  });
  el.entryClear.addEventListener('click', () => addAmount(-amountOn(current(), state.entryKey)));
  el.entryDone.addEventListener('click', closeEntry);
  el.entry.addEventListener('click', (e) => { if (e.target === el.entry) closeEntry(); });

  el.editBtn.addEventListener('click', openSheet);
  el.addFirst.addEventListener('click', openSheet);
  el.sheetDone.addEventListener('click', closeSheet);
  el.sheet.addEventListener('click', (e) => { if (e.target === el.sheet) closeSheet(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !el.sheet.hidden) closeSheet();
    if (e.key === 'Escape' && !el.entry.hidden) closeEntry();
  });

  /* ---------- Input ---------- */

  el.grid.addEventListener('click', (e) => {
    const b = e.target.closest('.day');
    const h = current();
    if (!b || b.disabled || !h) return;
    if (isCount(h)) { openEntry(b.dataset.key); return; }
    const k = b.dataset.key;
    const set = marks[h.id];
    const on = !set.has(k);
    if (on) set.add(k);
    else set.delete(k);
    b.setAttribute('aria-pressed', String(on));
    b.classList.remove('pop');
    void b.offsetWidth; // restart the animation
    b.classList.add('pop');
    save();
    renderStats();
  });

  el.grid.addEventListener('animationend', (e) => e.target.classList.remove('pop'));

  el.year.addEventListener('click', (e) => {
    const t = e.target.closest('[data-m]');
    if (!t) return;
    state.y = Number(t.dataset.y);
    state.m = Number(t.dataset.m);
    state.view = 'month';
    render();
  });

  el.viewBtns.forEach((b) => b.addEventListener('click', () => {
    state.view = b.dataset.view;
    render();
  }));

  el.habits.addEventListener('click', (e) => {
    const b = e.target.closest('.habit');
    if (!b) return;
    state.habit = b.dataset.habit;
    render();
  });

  function step(dir) {
    if (state.view === 'month') {
      const t = state.y * 12 + state.m + dir;
      state.y = Math.floor(t / 12);
      state.m = t - state.y * 12;
    } else {
      state.y += dir;
    }
    render();
  }

  el.prev.addEventListener('click', () => step(-1));
  el.next.addEventListener('click', () => step(1));

  el.todayBtn.addEventListener('click', () => {
    state.y = now.y;
    state.m = now.m;
    render();
  });

  el.demoClear.addEventListener('click', () => {
    state.demo = false;
    habits = [];
    marks = {};
    state.habit = null;
    save();
    render();
  });

  /* Keep "today" right if the app stays open past midnight. */
  function checkDay() {
    const before = now;
    readToday();
    if (now.key === before.key) return;
    if (state.y === before.y && (state.view === 'year' || state.m === before.m)) {
      state.y = now.y;
      state.m = now.m;
    }
    render();
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkDay();
  });
  window.addEventListener('focus', checkDay);
  window.addEventListener('pageshow', checkDay);
  window.addEventListener('resize', sizeYear);
  setInterval(checkDay, 60000);
  document.addEventListener('touchstart', () => {}, { passive: true }); // enables :active on iOS

  /* ---------- Start ---------- */

  const loaded = load();
  if (!loaded.ok && !PREVIEW) showNotice('This browser is blocking storage, so marks will not be kept.');
  if (!loaded.found && PREVIEW) {
    state.demo = true;
    loadExamples();
  }
  render();
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(function () {});
}
</script>
</body>
</html>
